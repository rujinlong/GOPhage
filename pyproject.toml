[project]
name = "gophage"
version = "0.3.0"
description = "GOPhage: GO-term annotation for phage proteins via ESM2 + Transformer + DiamondBLASTp"
readme = "README.md"
authors = [
    { name = "Jiaojiao Guan" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "biopython>=1.81",
    "numpy>=1.26",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch>=2.0",
    "transformers>=4.36",
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",
    "accelerate>=0.26",
    "fair-esm>=2.0",
    "einops>=0.7",
    "x-transformers>=1.27",
    "tqdm>=4.66",
    "regex>=2023.10",
    "safetensors>=0.4",
]

[project.scripts]
gophage = "gophage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gophage"]
